name: Deploy a GitHub Pages

# Se activa solo, cada vez que llega un push a main — no hay que acordarse
# de correr "npm run build" ni subir la carpeta dist/ a mano.
on:
  push:
    branches: [main, ceic-m1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar malla.json inmutable respecto de e20a070
        run: git diff --exit-code e20a070 -- src/data/malla.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # El smoke test corre ACÁ, entre el build y la subida del artefacto: si
      # alguna de las 16 rutas quedó rota, el job falla y `deploy` (que declara
      # `needs: build`) no llega a ejecutarse. Publicar primero y revisar
      # después es justo lo que dejó el sitio en blanco dos veces (bitácora c1
      # y c35), las dos detectadas por alguien que entró al sitio, no por
      # nosotros.
      - name: Instalar Chromium para el smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke test de las 16 rutas
        run: npm run test:smoke

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
