<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEIC USACH — Prototipo</title>
    <meta name="lang" content="es" />
    <!-- Truco de rafgraph/spa-github-pages: GitHub Pages no sabe servir rutas de una SPA
         (si entras directo a /vite-ceic-usach/wikiprofes o refrescas ahí, 404). public/404.html
         redirige codificando la ruta real en el query string; este script la decodifica de
         vuelta ANTES de que React Router monte, para que la app arranque en la ruta correcta. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <!-- Mismo truco que buscacursos.cl: aplicar el tema guardado (claro/oscuro
         u "modo amigable") ANTES del primer paint, para que no se vea un
         flash del tema equivocado mientras React arranca. Ver
         src/components/ThemeToggle.jsx para la lógica completa (este script
         es un resumen mínimo de la misma). -->
    <script type="text/javascript">
      (function () {
        try {
          var theme = localStorage.getItem("ceic-theme");
          var amigable = localStorage.getItem("ceic-amigable") === "on";
          var base =
            theme === "dark" || theme === "light"
              ? theme
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", amigable ? "amigable" : base);
        } catch (e) {
          /* localStorage no disponible: se queda con el tema claro por defecto */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
